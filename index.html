    <title>Mariutil | Free Online Tools for Developers</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Mariutil",
        "url": "https://mariutil.com/",
        "description": "Free online tools for developers and everyday work, including JSON formatting, XML to JSON conversion, and screen recording."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Mariutil tools",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "item": {
              "@type": "WebApplication",
              "name": "JSON Formatter",
              "url": "https://json.mariutil.com/",
              "description": "Format, validate, and minify JSON online. Your data stays in your browser."
            }
          },
          {
            "@type": "ListItem",
            "position": 2,
            "item": {
              "@type": "WebApplication",
              "name": "XML to JSON",
              "url": "https://xml2json.mariutil.com/",
              "description": "Convert XML to JSON online directly in your browser. Fast, private, and easy to use."
            }
          },
          {
            "@type": "ListItem",
            "position": 3,
            "item": {
              "@type": "WebApplication",
              "name": "Screen Recorder",
              "url": "https://screen.mariutil.com/",
              "description": "Record your screen online without installing software. Record directly in your browser."
            }
          }
        ]
      }
    </script>
